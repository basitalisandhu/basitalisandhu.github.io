name: sync

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh data/repos.json and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Sync from the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_repos.py
      - name: Rebuild and check
        run: python3 build.py --check
      - name: Open or update the sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: sync/repos-data
          delete-branch: true
          add-paths: |
            data/repos.json
            docs/**
          commit-message: "data: sync repository data from the GitHub API"
          title: "data: sync repository data from the GitHub API"
          body: |
            Daily refresh of `data/repos.json` (descriptions, topics, README first screens, install blocks, releases) and the rebuilt `docs/`, from `scripts/sync_repos.py`.

            The build and every site check passed in the sync job. Pull requests opened with the workflow token do not trigger other workflows, so close and reopen this one if you want the `ci` run as well.
          labels: sync
